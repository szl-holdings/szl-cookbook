<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>szl-cookbook — recipe carousel</title>
<meta name="description" content="Governance recipes as a rotating 3D card carousel. Each card runs against a real gate. No mysticism."/>
<style>
 :root{--bg:#070912;--fg:#e8ecf6;--accent:#5ad1ff;--accent2:#8b7bff;--green:#7CFFB2;--dim:#5b6478;}
 html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,sans-serif;overflow:hidden;}
 #c{position:fixed;inset:0;display:block;}
 .hud{position:fixed;left:18px;top:16px;z-index:5;pointer-events:none;}
 .hud h1{font-size:15px;font-weight:600;letter-spacing:.12em;margin:0;text-transform:uppercase;}
 .hud p{margin:4px 0 0;font-size:12px;color:var(--dim);font-family:'JetBrains Mono',monospace;}
 .tip{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:5;font-size:11px;color:var(--dim);font-family:'JetBrains Mono',monospace;}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud"><h1>szl-cookbook</h1><p>governance recipes · copy-paste · runs against a real gate</p></div>
<div class="tip">drag to spin the carousel · each card is a runnable recipe · doctrine v11</div>
<script type="importmap">{ "imports": {
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" }}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const RECIPES=["verify-receipt-chain","sign-a-verdict","gate-a-tool-call","replay-the-empire",
 "deploy-uds-bundle","emit-dsse-receipt","walk-khipu-dag","prove-lambda-bound","check-13-axis-yuyay","pin-a-doi"];
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x070912,0.02);
const camera=new THREE.PerspectiveCamera(55,1,0.1,200); camera.position.set(0,3,22);
const controls=new OrbitControls(camera,canvas); controls.enableDamping=true;
controls.minDistance=12; controls.maxDistance=50; controls.maxPolarAngle=Math.PI*0.62;
function makeCardTexture(title,idx){
 const cv=document.createElement('canvas'); cv.width=512; cv.height=320; const x=cv.getContext('2d');
 const g=x.createLinearGradient(0,0,512,320); g.addColorStop(0,'#0d1322'); g.addColorStop(1,'#0a1830');
 x.fillStyle=g; x.fillRect(0,0,512,320);
 x.strokeStyle='#5ad1ff'; x.lineWidth=4; x.strokeRect(6,6,500,308);
 x.fillStyle='#5ad1ff'; x.font='bold 22px monospace'; x.fillText(`recipe ${idx+1}/10`,28,52);
 x.fillStyle='#e8ecf6'; x.font='bold 30px sans-serif';
 const words=title.split('-'); words.forEach((w,i)=>x.fillText(w, 28, 110+i*40));
 x.fillStyle='#7CFFB2'; x.font='16px monospace'; x.fillText('$ szl-cookbook run '+title, 28, 280);
 x.fillStyle='#8b7bff'; x.fillRect(28,294,160,4);
 return new THREE.CanvasTexture(cv);
}
const group=new THREE.Group(); scene.add(group);
const R=10, N=RECIPES.length;
RECIPES.forEach((rp,i)=>{ const a=i/N*Math.PI*2;
 const geo=new THREE.PlaneGeometry(5.2,3.3);
 const mat=new THREE.MeshBasicMaterial({map:makeCardTexture(rp,i),side:THREE.DoubleSide,transparent:true});
 const m=new THREE.Mesh(geo,mat); m.position.set(Math.cos(a)*R,Math.sin(i*1.3)*0.6,Math.sin(a)*R);
 m.lookAt(0,m.position.y,0); m.rotateY(Math.PI); group.add(m);
 const glow=new THREE.Mesh(new THREE.PlaneGeometry(5.8,3.9),new THREE.MeshBasicMaterial({color:0x5ad1ff,transparent:true,opacity:0.07,side:THREE.DoubleSide}));
 glow.position.copy(m.position); glow.quaternion.copy(m.quaternion); group.add(glow);
});
// center beacon
const beacon=new THREE.Mesh(new THREE.IcosahedronGeometry(1.1,1),new THREE.MeshStandardMaterial({color:0x8b7bff,emissive:0x2a1f66,emissiveIntensity:1.4}));
scene.add(beacon);
scene.add(new THREE.AmbientLight(0x4060a0,1.2));
const l=new THREE.PointLight(0x5ad1ff,150,120); l.position.set(0,12,8); scene.add(l);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();
 group.rotation.y=t*0.18; beacon.rotation.y=t*0.6; beacon.material.emissiveIntensity=1.1+0.5*Math.sin(t*2);
 controls.update(); renderer.render(scene,camera);}
animate();
</script></body></html>
