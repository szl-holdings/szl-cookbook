name: Anatomy Evolved Smoke — Bounded Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diag-anatomy-evolved-smoke.yml
      - recipes/anatomy-evolved-v1/code/**

permissions:
  contents: read

concurrency:
  group: diag-anatomy-evolved-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Capture exact TypeScript smoke failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: recipes/anatomy-evolved-v1/code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: recipes/anatomy-evolved-v1/code/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Compile and preserve current smoke output
        id: smoke
        shell: bash
        run: |
          set +e
          mkdir -p ../../../reports/anatomy-evolved-smoke
          report=../../../reports/anatomy-evolved-smoke/smoke.log
          {
            echo '===== tsc --noEmit ====='
            npx tsc --noEmit
            echo "TYPECHECK_EXIT=$?"
            echo '===== doctrine guard ====='
            HITS=$(grep -rinE 'alloyscape|glass[ -]?wing|glasswing|mythos|stephen paul|perplexity computer' \
              src/ lean/ tests/ 2>/dev/null \
              | grep -v 'BANNED_TOKENS' \
              | grep -v 'doctrine-guard' \
              | wc -l || true)
            echo "DOCTRINE_HITS=$HITS"
            echo '===== test compilation ====='
            npx tsc -p tsconfig.test.json
            compile_code=$?
            echo "COMPILE_EXIT=$compile_code"
            if [ "$compile_code" -eq 0 ]; then
              echo '{"type":"commonjs"}' > dist-test/package.json
              echo '===== smoke runtime ====='
              node dist-test/tests/smoke.js
              smoke_code=$?
            else
              smoke_code=$compile_code
            fi
            echo "SMOKE_EXIT=$smoke_code"
          } > "$report" 2>&1
          cat "$report"
          echo "exit_code=$smoke_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload immutable diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anatomy-evolved-smoke-${{ github.run_id }}
          path: reports/anatomy-evolved-smoke
          if-no-files-found: error
          retention-days: 14
      - name: Preserve current result
        env:
          EXIT_CODE: ${{ steps.smoke.outputs.exit_code }}
        run: |
          code="${EXIT_CODE:-2}"
          if [ "$code" -ne 0 ]; then
            echo "::error::Anatomy-evolved smoke remains red; inspect the uploaded transcript."
            exit "$code"
          fi
          echo 'Anatomy-evolved smoke suite passed.'
