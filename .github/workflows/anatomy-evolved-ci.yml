# anatomy-evolved-v1 CI — tsc + doctrine guard + smoke tests
name: anatomy-evolved-ci
on:
  push:
    paths:
      - 'recipes/anatomy-evolved-v1/code/**'
      - '.github/workflows/anatomy-evolved-ci.yml'
  pull_request:
    paths:
      - 'recipes/anatomy-evolved-v1/code/**'
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recipes/anatomy-evolved-v1/code
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: recipes/anatomy-evolved-v1/code/package-lock.json
      - name: Install
        run: npm ci
      - name: TypeScript build (--noEmit)
        run: npx tsc --noEmit
      - name: Doctrine guard
        run: |
          set -euo pipefail
          HITS=$(grep -rinE 'alloyscape|glass[ -]?wing|glasswing|mythos|stephen paul|perplexity computer' \
            src/ lean/ tests/ 2>/dev/null \
            | grep -v 'BANNED_TOKENS' \
            | grep -v 'doctrine-guard' \
            | wc -l || true)
          if [ "$HITS" -gt 0 ]; then
            echo "DOCTRINE VIOLATION: $HITS banned-token hits outside guard arrays"
            exit 1
          fi
          echo "Doctrine guard: clean"
      - name: Compile + run smoke tests
        run: |
          npx tsc -p tsconfig.test.json
          echo '{"type":"commonjs"}' > dist-test/package.json
          node dist-test/tests/smoke.js